# Benchmarks (spec section 22: bench.yml; section 26). They run by hand or once a week, not on every PR:
# the shared runners are not the reference machine and the numbers only show trends.
# PR-04 (scroll) does not run here: it needs a real screen with vsync (see bench/README.md).
name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  micro:
    name: BenchmarkDotNet (bench/Micro)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Micro benchmarks
        run: dotnet run -c Release --project bench/Micro -- --filter * --artifacts BenchmarkDotNet.Artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bench-micro
          path: BenchmarkDotNet.Artifacts/results/

  startup:
    name: NativeAOT startup (PR-01) and memory (PR-16)
    runs-on: windows-latest
    timeout-minutes: 45
    # The window needs a desktop session; hosted runners do not guarantee one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish NativeAOT
        shell: pwsh
        run: |
          . ./bench/Scenarios/Common.ps1
          Publish-Eunomia

      - name: PR-01
        shell: pwsh
        run: ./bench/Scenarios/Measure-Startup.ps1 -Runs 10 -NoPublish -OutFile startup.json

      - name: PR-16
        shell: pwsh
        run: ./bench/Scenarios/Measure-IdleMemory.ps1 -Seconds 60 -Runs 1 -NoPublish -OutFile memory.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-startup-memory
          path: |
            startup.json
            memory.json
          if-no-files-found: ignore
