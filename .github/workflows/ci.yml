# Releases only: every push to main (a merged pull request) builds the packages of the 5 targets and publishes them as
# a GitHub release. No tests run on GitHub: they run locally before the pull request (CONTRIBUTING.md, section 6).
# The file keeps its name: the build number ($GITHUB_RUN_NUMBER, EunomiaBuild in Directory.Build.props, compared by the
# update check) is counted per workflow file, and a new file would start again at 1.
name: release

on:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

# Least privilege: the GITHUB_TOKEN only reads the repository (the release job asks for more).
permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, aot: true }
          - { os: ubuntu-latest, rid: linux-x64, aot: true }
          # No ARM runner or cross-compile sysroot: self-contained with JIT (runs the same, starts slower).
          - { os: ubuntu-latest, rid: linux-arm64, aot: false }
          - { os: macos-latest, rid: osx-arm64, aot: true }
          # The macOS ILCompiler targets x64 from the arm64 runner.
          - { os: macos-latest, rid: osx-x64, aot: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NativeAOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(dotnet msbuild src/App.Desktop/App.Desktop.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      # Windows: the portable ZIP (build/Publish-Portable.ps1).
      - name: Publish and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Publish-Portable.ps1

      - name: Publish (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.aot }}" = "true" ]; then
            dotnet publish src/App.Desktop/App.Desktop.csproj -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}
          else
            dotnet publish src/App.Desktop/App.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=false -o artifacts/publish/${{ matrix.rid }}
          fi
          ls -la artifacts/publish/${{ matrix.rid }}

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build/package-unix.sh ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: eunomia-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  # The packages of the 5 targets become a GitHub release, tagged v<Version>-build.<run number>; a pre-release while the
  # version has a pre-release label (1.0.0-beta.1).
  release:
    name: Release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating the tag and the release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          pattern: eunomia-*
          path: packages
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(dotnet msbuild src/App.Desktop/App.Desktop.csproj -getProperty:Version)
          tag="v$version-build.$GITHUB_RUN_NUMBER"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<NOTES
          Build $GITHUB_RUN_NUMBER of Eunomia $version from commit $GITHUB_SHA.

          | System | Package |
          | --- | --- |
          | Windows x64 | \`Eunomia-$version-win-x64.zip\`: extract and run \`Eunomia.exe\` |
          | macOS Apple silicon / Intel | \`Eunomia-$version-osx-arm64.zip\` / \`osx-x64.zip\`: extract and open \`Eunomia.app\` |
          | Linux x64 / arm64 | \`Eunomia-$version-linux-x64.tar.gz\` / \`linux-arm64.tar.gz\`: extract and run \`install.sh\` |

          The executables are not signed: Windows SmartScreen and macOS Gatekeeper ask for confirmation the first time
          (see docs/user-guide.md).
          NOTES
          ls -la packages
          gh release create "$tag" packages/* --target "$GITHUB_SHA" --title "Eunomia $version (build $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md --generate-notes "${prerelease[@]}"
