# CI de cada push e pull request (secção 22: ci.yml; secção 25.1: snapshots em cada PR).
# Build + testes em Windows, Linux e macOS (Fase 14); publish dos 5 alvos com smoke test do executável e pacotes;
# integração contra servidores reais em Linux.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

# Menor privilégio: o GITHUB_TOKEN só lê o repositório.
permissions:
  contents: read

# Um push novo num PR cancela a corrida anterior desse PR; no main corre cada push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatação e estilo (.editorconfig) e pacotes com vulnerabilidades conhecidas (CONTRIBUTING.md, secção 5).
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Eunomia.slnx

      - name: Formatação e estilo
        run: dotnet format Eunomia.slnx --verify-no-changes --no-restore --severity warn

      - name: Pacotes com vulnerabilidades conhecidas
        run: |
          dotnet list Eunomia.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            dotnet list Eunomia.slnx package --vulnerable --include-transitive
            exit 1
          fi


  test:
    name: Build e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Secret Service para os testes do cofre (libsecret) e fontes para o rendering headless.
      - name: Dependências (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0 fonts-dejavu-core

      - name: Restore
        run: dotnet restore Eunomia.slnx

      # TreatWarningsAsErrors está no Directory.Build.props: um warning parte o build.
      - name: Build
        run: dotnet build Eunomia.slnx -c Release --no-restore

      - name: Testes (unitários, arquitetura, headless e snapshots)
        if: runner.os != 'Linux'
        run: dotnet test Eunomia.slnx -c Release --no-build --logger trx --results-directory TestResults

      # Numa sessão D-Bus própria com o GNOME Keyring desbloqueado (o teste do Secret Service corre a sério). Recolhe a
      # cobertura de linhas (coletor do Microsoft.NET.Test.Sdk), junta à da integração no job "cobertura".
      - name: Testes (Linux, com Secret Service e cobertura)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n eunomia | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            dotnet test Eunomia.slnx -c Release --no-build --logger trx --results-directory TestResults --collect "Code Coverage;Format=cobertura"'

      - name: Cobertura (unitários)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          # Só o relatório juntado da corrida (os de cada projeto repetem as mesmas linhas).
          path: TestResults/*/*.cobertura.xml
          if-no-files-found: ignore

      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/

      # Em Windows os snapshots comparam com as baselines (o PNG obtido fica só em falha); em Linux e macOS ficam
      # sempre, para rever o aspeto com as fontes de cada sistema (ver tests/UI.Headless/Snapshot.cs).
      - name: Snapshots obtidos
        if: always() && (runner.os != 'Windows' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-${{ runner.os }}
          path: tests/UI.Headless/bin/Release/net10.0/snapshots-actual/
          if-no-files-found: ignore

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, aot: true, smoke: false }
          - { os: ubuntu-latest, rid: linux-x64, aot: true, smoke: true }
          # Sem runner ARM nem sysroot de cross-compile: self-contained com JIT (corre igual, arranca mais devagar).
          - { os: ubuntu-latest, rid: linux-arm64, aot: false, smoke: false }
          - { os: macos-latest, rid: osx-arm64, aot: true, smoke: true }
          # O ILCompiler do macOS compila para x64 a partir do runner arm64.
          - { os: macos-latest, rid: osx-x64, aot: true, smoke: false }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Toolchain NativeAOT (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb

      - name: Versão
        id: version
        shell: bash
        run: echo "value=$(dotnet msbuild src/App.Desktop/App.Desktop.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      # Windows: a mesma função dos benchmarks e o ZIP portable (build/Publish-Portable.ps1).
      - name: Publish e pacote (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Publish-Portable.ps1

      - name: Publish (Linux e macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.aot }}" = "true" ]; then
            dotnet publish src/App.Desktop/App.Desktop.csproj -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}
          else
            dotnet publish src/App.Desktop/App.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=false -o artifacts/publish/${{ matrix.rid }}
          fi
          ls -la artifacts/publish/${{ matrix.rid }}

      # O executável arranca, desenha a janela e sai (--startup-probe, settings em memória, dados sintéticos).
      - name: Smoke test do executável
        if: matrix.smoke
        shell: bash
        run: |
          exe=artifacts/publish/${{ matrix.rid }}/Eunomia
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          # Sem o timeout do GNU no macOS: espera no máximo 120 s e mata.
          $run "$exe" --startup-probe "$PWD/probe.json" --exit &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "O executável não terminou em 120 s"; exit 1; fi
          wait "$pid"
          cat probe.json
          grep -Eq '"nativeAot": *true' probe.json

      - name: Pacote (Linux e macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build/package-unix.sh ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: eunomia-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  # Testes de integração contra servidores reais (secção 24; Fase 3). Os service containers só existem em Linux;
  # o driver e o motor não têm dependências de Windows, por isso os mesmos testes correm aqui.
  integration:
    name: Integração (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.0", "mysql:8.4", "mariadb:10.6", "mariadb:11.4"]
    services:
      # Servidor OpenSSH com TCP forwarding (mod do linuxserver.io) para os testes do túnel SSH.
      ssh:
        image: linuxserver/openssh-server:latest
        env:
          PUID: "1000"
          PGID: "1000"
          USER_NAME: eunomia
          USER_PASSWORD: eunomia
          PASSWORD_ACCESS: "true"
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: eunomia
          MARIADB_ROOT_PASSWORD: eunomia
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -peunomia || mariadb-admin ping -h 127.0.0.1 -peunomia"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Testes de integração
        env:
          EUNOMIA_IT_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=eunomia;"
          EUNOMIA_IT_SSH: "127.0.0.1;2222;eunomia;eunomia"
          EUNOMIA_IT_SSH_TARGET: "db;3306"
        # Cobertura numa das imagens (os caminhos de escrita do driver correm aqui; junta-se à dos unitários).
        run: |
          coverage=()
          if [ "${{ matrix.image }}" = "mysql:8.4" ]; then coverage=(--collect "Code Coverage;Format=cobertura"); fi
          dotnet test tests/Integration -c Release --logger trx --results-directory TestResults "${coverage[@]}"

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ strategy.job-index }}
          path: TestResults/

      - name: Cobertura (integração)
        if: always() && matrix.image == 'mysql:8.4'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          # Só o relatório juntado da corrida (os de cada projeto repetem as mesmas linhas).
          path: TestResults/*/*.cobertura.xml
          if-no-files-found: ignore

  # Cobertura de linhas por projeto (unitários em Linux + integração no MySQL 8.4) e limiares que só sobem
  # (build/coverage-baseline.json, roadmap 2.2): um projeto do core que desce abaixo do limiar faz falhar.
  cobertura:
    name: Cobertura
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Cobertura por projeto e limiares
        run: python3 build/coverage.py coverage --summary "$GITHUB_STEP_SUMMARY"
