name: Bug
description: Something does not work, works wrongly, or the app closed.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Eunomia. The more precise the steps, the faster the bug gets fixed.
        **Do not paste passwords, customer data or SQL containing sensitive data.**

  - type: input
    id: version
    attributes:
      label: Eunomia version
      description: In Help › About, or in the window title (for example `1.0.0-beta.1`).
      placeholder: "1.0.0-beta.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: "Windows: Win+R, `winver`, Enter. macOS: Apple menu › About This Mac. Linux: distribution, version and desktop (X11 or Wayland)."
      placeholder: "Windows 11 Pro 24H2 (build 26100.2314) / macOS 15.1 / Ubuntu 24.04, GNOME on Wayland"
    validations:
      required: true

  - type: dropdown
    id: scale
    attributes:
      label: Display scale
      description: Settings › System › Display › Scale. With several monitors, the one where the window was.
      options:
        - "100%"
        - "125%"
        - "150%"
        - "175%"
        - "200% or more"
        - "Other / don't know"
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - MySQL
        - MariaDB
        - Other (Percona, Aurora, TiDB…)
        - Not applicable (the bug does not depend on the server)
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: "Shown in the status bar after connecting, or with `SELECT VERSION();`."
      placeholder: "8.0.36 / 10.11.6-MariaDB"

  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - Local (same machine)
        - Network (direct TCP/IP)
        - SSH tunnel
        - Not applicable

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: One step per line, starting from launching the app.
      placeholder: |
        1. Open the "local" session
        2. Click the `customers` table
        3. Open the Data tab
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error message (exact text), what appeared in the SQL log and, if it helps, a screenshot (you can paste the image here).
    validations:
      required: true

  - type: textarea
    id: crash
    attributes:
      label: Crash report (if any)
      description: |
        If the app closed or showed an unexpected error, open the logs folder and drag the most recent `crash-*.json` here (or a ZIP with it):
        `%LOCALAPPDATA%\Eunomia\logs` on Windows (Win+R, paste the path, Enter; `data\logs` next to `Eunomia.exe` in portable mode),
        `~/Library/Application Support/Eunomia/logs` on macOS, `~/.local/share/Eunomia/logs` on Linux.
        The file contains no SQL, values, host names or user names.

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Does it always happen or only sometimes? Did it work in an earlier version? What does HeidiSQL do in the same case?
