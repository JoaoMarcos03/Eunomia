name: Feedback
description: Suggestions, things that felt odd coming from HeidiSQL, what is missing or what could be simpler.
title: "[Feedback] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback. If something does not work or the app closed, please use the **Bug** form instead.

  - type: input
    id: version
    attributes:
      label: Eunomia version
      description: In Help › About, or in the window title.
      placeholder: "1.0.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sessions and connection (Session Manager, SSH)
        - Object tree
        - Data tab and grid
        - Query tab and SQL editor
        - Table editor
        - Import and export
        - Schema visualizer
        - Look and feel (theme, icons, sizes)
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What you did, what you expected and what you suggest. A screenshot helps a lot.
    validations:
      required: true

  - type: textarea
    id: heidisql
    attributes:
      label: How HeidiSQL does it
      description: If you come from HeidiSQL, how it works there and what felt odd here.

  - type: dropdown
    id: impact
    attributes:
      label: How much it affects you
      options:
        - It stops me from switching from HeidiSQL to Eunomia
        - It gets in the way every day
        - Nice to have
